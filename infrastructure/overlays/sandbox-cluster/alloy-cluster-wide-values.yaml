alloy:
  resources:
    requests:
      memory: 128Mi # Need to set a request for Alloy to avoid OOMKilled in sandbox-cluster
    limits:
      memory: 256Mi
  configMap:
    content: |-
      // Override Alloy config map for sandbox-cluster here if needed
      logging {
        level  = "debug" // Override info to debug for sandbox
        format = "logfmt"
      }

      livedebugging {
        enabled = true
      }

      // Scrape KSM Service directly or via ServiceMonitor discovery
      prometheus.operator.servicemonitors "cluster_wide_metrics" {
        selector {
          match_expression {
            key      = "app.kubernetes.io/name"
            operator = "In"
            values   = ["kube-state-metrics"]
          }
        }
        forward_to = [prometheus.remote_write.mimir.receiver]
      }

      prometheus.remote_write "mimir" {
        endpoint {
          url = "http://obs-sandbox-mimir-gateway.observability/api/v1/push"
          headers = {
            "X-Scope-OrgID" = "INFRA-2", // Overridden OrgID
          }
          queue_config {
            capacity             = 500
            max_samples_per_send = 500
            max_shards           = 10
          }
        }
        wal {
          truncate_frequency = "1m"
        }
        external_labels = {
          "cluster"     = "Sandbox-cluster", // Overridden label
          "cloud"       = "onprem",
          "environment" = "sandbox",                // Overridden environment
          "region"      = "us-east-1",
        }
      }