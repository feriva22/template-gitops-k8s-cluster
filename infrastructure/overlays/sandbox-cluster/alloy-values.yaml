alloy:
  resources:
    requests:
      memory: 128Mi
    limits:
      memory: 512Mi
  extraEnv:
  - name: NODE_IP
    valueFrom: { fieldRef: { fieldPath: status.hostIP } }
  - name: NODE_NAME
    valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
  - name: GOMEMLIMIT
    value: "400MiB"
  configMap:
    content: |-
      logging {
        level  = "info"
        format = "logfmt"
      }

      livedebugging {
        enabled = false
      }

      // 1. Discover Node Specific Metrics (Kubelet / Kube-Proxy)
      prometheus.operator.servicemonitors "k8s_node_specific_metrics" {
        selector {
          match_expression {
            key      = "app"
            operator = "In"
            values   = ["kube-prometheus-stack-kube-proxy","kube-prometheus-stack-kubelet"]
          }
        }
        namespaces      = ["monitoring"]
        kubernetes_role = "endpointslice"
      }

      // 2. Discover Node Exporter Metrics
      prometheus.operator.servicemonitors "node_exporter_specific_metrics" {
        selector {
          match_expression {
            key      = "app.kubernetes.io/name"
            operator = "In"
            values   = ["prometheus-node-exporter"]
          }
        }
        namespaces      = ["monitoring"]
        kubernetes_role = "endpointslice"

        scrape {
          default_scrape_interval = "60s"
          default_scrape_timeout  = "10s"
        }
      }

      // 3. Filter targets BEFORE scraping using discovery.relabel
      discovery.relabel "node_local_filter" {
        targets = concat(
          prometheus.operator.servicemonitors.k8s_node_specific_metrics.targets,
          prometheus.operator.servicemonitors.node_exporter_specific_metrics.targets,
        )

        // Keep only targets where the endpoint node metadata matches this pod's node name
        rule {
          source_labels = ["__meta_kubernetes_endpoint_node_name"]
          regex         = sys.env("NODE_NAME")
          action        = "keep"
        }

        // Namespace drop
        rule {
          source_labels = ["namespace"]
          regex         = "kube-system|kube-public"
          action        = "drop"
        }
      }

      // 4. Actually execute the HTTP scrape on the filtered local targets only
      prometheus.scrape "node_scrape" {
        targets    = discovery.relabel.node_local_filter.output
        forward_to = [prometheus.relabel.metric_drops.receiver]
        
        scrape_interval = "60s"
        scrape_timeout  = "10s"
      }

      // 5. Apply metric-level drops to reduce cardinality and memory
      prometheus.relabel "metric_drops" {
        rule {
          source_labels = ["__name__"]
          regex         = "container_last_seen|container_start_time_seconds|container_tasks_state|container_threads|container_processes|container_file_descriptors|container_sockets|container_oom_events_total|container_memory_failures_total|container_memory_cache|container_memory_swap|container_memory_mapped_file|machine_.*|storage_.*|kubelet_.*certificate.*|kubelet_http_.*|kubelet_pleg_.*|kubelet_runtime_operations_.*|kubelet_pod_start_.*"
          action        = "drop"
        }

        forward_to = [prometheus.remote_write.mimir.receiver]
      }

      prometheus.remote_write "mimir" {
        endpoint {
          url = "http://obs-sandbox-mimir-gateway.observability/api/v1/push"
          headers = {
            "X-Scope-OrgID" = "INFRA-2",
          }
          queue_config {
            capacity             = 500
            max_samples_per_send = 500
            max_shards           = 10
          }
        }
        wal {
          truncate_frequency = "1m"
        }
        external_labels = {
          "cluster"     = "Sandbox-cluster",
          "cloud"       = "onprem",
          "environment" = "sandbox",
          "region"      = "us-east-1",
          "source"      = "node-agent",
        }
      }