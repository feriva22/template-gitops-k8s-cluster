alloy:
  resources:
    requests:
      memory: 128Mi # Need to set a request for Alloy to avoid OOMKilled in sandbox-cluster
    limits:
      memory: 512Mi
  extraEnv:
  - name: NODE_IP
    valueFrom: { fieldRef: { fieldPath: status.hostIP } }
  - name: NODE_NAME
    valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
  - name: GOMEMLIMIT
    value: "400MiB"
  configMap:
    content: |-
      // Override Alloy config map for sandbox-cluster here if needed
      logging {
        level  = "info" // Override info to debug for sandbox
        format = "logfmt"
      }

      livedebugging {
        enabled = false // Disable livedebugging for sandbox-cluster
      }

      // Scrape Node Specific Metrics
      prometheus.operator.servicemonitors "k8s_node_specific_metrics" {
        selector {
          match_expression {
            key      = "app"
            operator = "In"
            values   = ["kube-prometheus-stack-kube-proxy","kube-prometheus-stack-kubelet"]
          }
        }
        forward_to = [prometheus.relabel.node_local_filter.receiver]
      }

      // Scrape Node Exporter Specific Metrics
      prometheus.operator.servicemonitors "node_exporter_specific_metrics" {
        selector {
          match_expression {
            key      = "app.kubernetes.io/name"
            operator = "In"
            values   = ["prometheus-node-exporter"]
          }
        }
        forward_to = [prometheus.relabel.node_local_filter.receiver]
      }

      prometheus.relabel "node_local_filter" {
        max_cache_size = 20000  // Reduce the RAM , RSS — should drop by the retained-label amount (tens of MB) and go_memstats_heap_objects — should fall.
        // Only this node
        rule { source_labels = ["node"]; regex = sys.env("NODE_NAME"); action = "keep" }

        // Namespace drop (kube-system only — keep monitoring for node-exporter!)
        rule { source_labels = ["namespace"]; regex = "kube-system|kube-public"; action = "drop" }

        // Metric family drops (keep container_fs_* and container_blkio_* for I/O panels)
        rule {
          source_labels = ["__name__"]
          regex         = "container_last_seen|container_start_time_seconds|container_tasks_state|container_threads|container_processes|container_file_descriptors|container_sockets|container_oom_events_total|container_memory_failures_total|container_memory_cache|container_memory_swap|container_memory_mapped_file|machine_.*|storage_.*|kubelet_.*certificate.*|kubelet_http_.*|kubelet_pleg_.*|kubelet_runtime_operations_.*|kubelet_pod_start_.*"
          action        = "drop"
        }
        forward_to = [prometheus.remote_write.mimir.receiver]
      }

      prometheus.remote_write "mimir" {
        endpoint {
          url = "http://obs-sandbox-mimir-gateway.observability/api/v1/push"
          headers = {
            "X-Scope-OrgID" = "INFRA-2", // Overridden OrgID
          }
          queue_config {
            capacity             = 500
            max_samples_per_send = 500
            max_shards           = 10
          }
        }
        wal {
          truncate_frequency = "1m"
        }
        external_labels = {
          "cluster"     = "Sandbox-cluster", // Overridden label
          "cloud"       = "onprem",
          "environment" = "sandbox",                // Overridden environment
          "region"      = "us-east-1",
          "source"      = "node-agent",
        }
      }