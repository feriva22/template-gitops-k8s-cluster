apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: demo
  namespace: monitoring
spec:
  mode: daemonset
  targetAllocator:
    enabled: true
    allocationStrategy: per-node
    serviceAccount: alloy
    prometheusCR:
      enabled: true
      podMonitorSelector: 
        matchLabels:
          release: kube-prometheus-stack
      serviceMonitorSelector: 
        matchLabels:
          release: kube-prometheus-stack
  config:
    receivers:
      prometheus:
        config:
          scrape_configs:
            - job_name: 'otel-collector'
              scrape_interval: 10s
              static_configs:
                - targets: ['0.0.0.0:8888']
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 75
        spike_limit_percentage: 15
    exporters:
      debug:
        verbosity: detailed
      prometheusremotewrite:
        endpoint: "http://obs-sandbox-mimir-gateway.observability/api/v1/push"
        headers:
          "X-Scope-OrgID": "INFRA-2"
        external_labels:
          cluster: "Sandbox-cluster"
          cloud: "onprem"
          environment: "sandbox"
          region: "us-east-1"
          source: "node-agent"
        remote_write_queue:
          queue_size: 500           # Mirrors capacity
          num_consumers: 10          # Mirrors max_shards

    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter]
          exporters: [debug]
        metrics:
          receivers: [otlp, prometheus]
          processors: [memory_limiter]
          exporters: [debug]
        logs:
          receivers: [otlp]
          processors: [memory_limiter]
          exporters: [debug]
