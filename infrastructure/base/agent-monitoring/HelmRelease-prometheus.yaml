apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 10m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "81.5.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
  values:
    prometheus:
      enabled: false
    alertmanager:
      enabled: false
    grafana:
      enabled: false
    crds:
      enabled: true
    prometheusOperator:
      enabled: true
    nodeExporter:
      enabled: true
    kubeStateMetrics:
      enabled: true
    defaultRules:
      create: true
    kubernetesServiceMonitors:
      enabled: true