apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy
  namespace: monitoring
spec:
  interval: 10m
  chart:
    spec:
      chart: alloy
      version: "1.6.0"
      sourceRef:
        kind: HelmRepository
        name: grafana
  valuesFrom:
    - kind: ConfigMap
      name: alloy-values-override
      optional: false
  values:
    controller:
      type: 'daemonset'
      rbac:
        create: true
    alloy:
      clustering:
        enabled: false
      extraEnv:
        - name: GOMEMLIMIT
          value: "75MiB"
        - name: GOGC
          value: "50"
        - name: NODE_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName