apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: opentelemetry-kube-stack
  namespace: monitoring
spec:
  interval: 10m
  chart:
    spec:
      chart: opentelemetry-kube-stack
      sourceRef:
        kind: HelmRepository
        name: opentelemetry
  values:
    opentelemetry-operator:
      manager:
        collectorImage:
          repository: otel/opentelemetry-collector-contrib
    defaultCRConfig:
      image:
        repository: otel/opentelemetry-collector-contrib
        tag: "0.160.0"
    instrumentation:
      enabled: false
    opAMPBridge:
      enabled: false
    kubernetesServiceMonitors:
      enabled: true
    kubeApiServer:
      enabled: true
    kubelet:
      enabled: true
    kubeControllerManager:
      enabled: true
    kubeDns:
      enabled: true
    kubeEtcd:
      enabled: true
    kubeScheduler:
      enabled: true
    kubeProxy:
      enabled: true
    kubeStateMetrics:
      enabled: true
    nodeExporter:
      enabled: true
    collectors:
      daemon:
        enabled: true
        # because this file is inside the examples folder, we need to reference it directly.
        scrape_configs_file: "examples/prometheus-otel/kubelet_scrape_configs.yaml"
        # Adding an additional label for this collctor.
        labels:
          otel-collector-type: daemonset-example
        targetAllocator:
          enabled: true
          image: ghcr.io/open-telemetry/opentelemetry-operator/target-allocator:main
          allocationStrategy: per-node
          prometheusCR:
            enabled: true
            podMonitorSelector: {}
            scrapeInterval: "30s"
            serviceMonitorSelector: {}
        presets:
          logsCollection:
            enabled: false
          kubeletMetrics:
            enabled: false
          hostMetrics:
            enabled: false
          kubernetesAttributes:
            enabled: false
          kubernetesEvents:
            enabled: false
          clusterMetrics:
            enabled: false
        config:
          exporters:
            debug: {}
            prometheus_remote_write:
              endpoint: "http://metrics-new.posindonesia.deploy-at.my.id/metrics/api/v1/push"
              headers:
                "X-Scope-OrgID": "INFRA-Production"
              external_labels:
                cluster: "Sandbox-cluster"
                cloud: "onprem"
                environment: "sandbox"
                region: "us-east-1"
                source: "node-agent"
              remote_write_queue:
                queue_size: 500           # Mirrors capacity
                num_consumers: 10
          # Pipelines
          service:
            pipelines:
              metrics:
                receivers: 
                  - prometheus
                exporters:
                  - debug
                  - prometheus_remote_write